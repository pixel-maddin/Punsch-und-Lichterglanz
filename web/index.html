<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#1a1030">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lichterglanz">
  <title>Punsch &amp; Lichterglanz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css?v=202610311530">
</head>
<body>
  <div id="buehne">
    <div id="huelle">
      <canvas id="cv" width="180" height="320"></canvas>
      <!-- Die Karte des Standes unten, fein über dem Spielbild (kacheln.js) -->
      <div id="theke" aria-hidden="true"></div>

      <div id="hud">
        <button id="nachr" aria-label="Nachrichten"><canvas class="hud-ico" data-bild="post" width="80" height="80"></canvas><i id="nachrPunkt" class="versteckt"></i></button>
        <div id="geld"><canvas class="hud-ico" data-bild="stern" width="80" height="80"></canvas><span id="geldZahl">0 Sterne</span></div>
        <div id="stimmung"><canvas class="hud-ico" data-bild="herz" width="80" height="80"></canvas><span id="stimmungZahl"></span></div>
        <div id="pause" class="versteckt">⏸ Pause</div>
        <div id="uhr"></div>
      </div>

      <button id="ziel" class="versteckt"></button>
      <button id="btnHaus" class="knopf-oben versteckt" aria-label="Haus schmücken"><canvas width="80" height="80"></canvas><span>Haus</span></button>
      <button id="btnStandkarte" class="knopf-oben versteckt" aria-label="Dein Angebot: was dein Stand anbietet"><canvas width="80" height="80"></canvas><span>Angebot</span><i id="standkartePunkt" class="versteckt"></i></button>

      <div id="zeiger" class="versteckt"></div>
      <div id="tipp" class="versteckt" role="status" aria-live="polite"></div>
      <div id="toast" role="status" aria-live="polite"></div>

      <!-- Die Übersichtskarte (karte.js): Orte statt Laden-Reiter -->
      <section id="landkarte" class="versteckt">
        <canvas id="kartenCv" width="180" height="320"></canvas>
        <div id="kartenOrte"></div>
        <button id="kartenZu" aria-label="Karte schließen">✕</button>
        <button id="kartenText" aria-label="Schilder ein- oder ausblenden">Aa</button>
      </section>

      <!-- Minispiele (lichtung.js): eigenes Vollbild über allem -->
      <section id="minispiel" class="versteckt">
        <canvas id="miniCv" width="180" height="320"></canvas>
        <button id="miniZu" aria-label="Minispiel beenden">✕</button>
      </section>

      <nav id="leiste">
        <button id="btnLaden"><canvas class="sym" data-ico="landkarte"></canvas>Karte<b id="ladenBadge" class="versteckt">0</b></button>
        <button id="btnAuftraege"><canvas class="sym" data-ico="auftraege"></canvas>Aufträge<b id="aufBadge" class="versteckt">0</b></button>
        <button id="btnKalender"><canvas class="sym" data-ico="kalender"></canvas>Kalender<b id="kalBadge" class="versteckt">0</b></button>
        <button id="btnKarte"><canvas class="sym" data-ico="karte"></canvas>Foto</button>
        <button id="btnMenue"><canvas class="sym" data-ico="menue"></canvas>Menü</button>
      </nav>

      <section id="blatt" class="versteckt" role="dialog" aria-labelledby="blattTitel">
        <header>
          <h1 id="blattTitel">Einkaufen</h1>
          <span id="blattGeld"></span>
          <button id="blattZu" aria-label="Schließen">✕</button>
        </header>
        <div id="blattTabs"></div>
        <div id="blattInhalt"></div>
      </section>

      <div id="modal" class="versteckt" role="dialog" aria-modal="true" aria-labelledby="modalTitel"></div>
    </div>
    <div id="quer"><div>📱<br><b>Bitte hochkant halten</b><br><small>Das Spiel ist fürs Hochformat gemacht.</small></div></div>
  </div>
  <script type="module" src="src/main.js?v=202610311530"></script>
</body>
</html>
